version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: beacon_user
      POSTGRES_PASSWORD: beacon_password
      POSTGRES_DB: beacon_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

